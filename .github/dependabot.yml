version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    # Version updates wait 30 days after a release before Dependabot proposes
    # them. Security updates are exempt and still arrive immediately.
    cooldown:
      default-days: 30
    # napi, napi-derive and napi-build are ABI-coupled: a lone napi-derive bump
    # (#282) produced 16 compile errors. Propose them as a single grouped PR.
    groups:
      napi:
        patterns:
          - "napi"
          - "napi-derive"
          - "napi-build"

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 30
    # Phantom floor pins (PF-001): fast-uri, nanoid and js-yaml are exact-ish devDependencies
    # with NO source importer; they exist only to hold a transitive floor because root
    # `overrides` do not reify in this monorepo. Their real consumers require the current
    # majors (ajv -> fast-uri ^3, postcss -> nanoid ^3, @napi-rs/cli -> js-yaml ^4), so a
    # semver-major bump of the pin only adds a duplicate copy next to the consumer's own
    # resolution. Dependabot #355, #357 and #279 were false positives on exactly this
    # (#355 was also a security regression: fast-uri 4.1.2 predates the 2026-08-23 fix
    # releases). Per the Dependabot options reference, `ignore` filters VERSION updates
    # only — Dependabot SECURITY updates for these packages still arrive.
    ignore:
      - dependency-name: "fast-uri"
        update-types: ["version-update:semver-major"]
      - dependency-name: "nanoid"
        update-types: ["version-update:semver-major"]
      - dependency-name: "js-yaml"
        update-types: ["version-update:semver-major"]
      # typescript 7.x is blocked on a build-system migration, not a version bump: the CJS half of
      # the dual build (packages/{bundler-utils,webpack-loader,rspack-loader}/tsconfig.cjs.json)
      # uses moduleResolution=node10, which TS 7 removed (TS5108). Tracked in #364; remove this
      # entry when it lands. `ignore` filters VERSION updates only — SECURITY updates still arrive.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
    cooldown:
      default-days: 30
