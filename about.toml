# List the policy allow list first, then exception licenses in deny.toml order (#136).
accepted = ["MIT", "Apache-2.0", "ISC", "CC0-1.0", "Unicode-3.0", "Zlib", "Apache-2.0 WITH LLVM-exception"]
# Include the native addon targets and the WASM target.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-gnu",
    "aarch64-unknown-linux-musl",
    "x86_64-pc-windows-msvc",
    "wasm32-unknown-unknown",
]
ignore-dev-dependencies = false
ignore-build-dependencies = false

[private]
ignore = false
