[package]
name = "mds-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "MDS compiler WebAssembly bindings"
# Explicit (not workspace-inherited) on purpose: older wasm-pack manifest parsers
# read these npm-metadata fields without resolving Cargo workspace inheritance and
# choke on `license.workspace = true` ("invalid type: map, expected a string").
# mds-wasm is not published to crates.io, so DRY inheritance buys nothing here.
license = "MIT"
repository = "https://github.com/dean0x/mdscript"
keywords = ["markdown", "template", "llm", "prompt", "compiler"]
categories = ["wasm", "template-engine"]
# Not published to crates.io: distribution is an npm/WASM package (@mdscript/mds-wasm).
# NOTE: license and repository above are explicit (not workspace-inherited) by design —
# older wasm-pack parsers choke on workspace inheritance for those fields. Do not
# convert them. See the comment on the license field for context.
publish = false

[features]
# Expose the raw Rust panic payload as `err.detail` on mds::internal errors.
# Enable during local development to diagnose unexpected panics. NEVER enable
# in production builds — panic messages contain absolute filesystem paths.
debug-panics = []

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mds = { package = "mds-core", path = "../mds-core", version = "0.3.0" }
wasm-bindgen = { workspace = true }
serde-wasm-bindgen = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
js-sys = { workspace = true }

[dev-dependencies]
mds = { package = "mds-core", path = "../mds-core", version = "0.3.0" }
wasm-bindgen-test = { workspace = true }

[package.metadata.wasm-pack.profile.release]
wasm-opt = [
  # -Oz: optimize for size. --flatten + second -Oz + --rereloop restructure
  # the code graph for better size reduction. --converge runs until stable
  # (adds ~2-3x wasm-opt runtime but shrinks by ~446 bytes vs single pass,
  # measured with wasm-opt v117; CI Binaryen v129 is authoritative for release).
  # --strip-producers drops the producer section (~62 bytes, same provenance).
  # NOTE: --gufa was measured and REGRESSES size by ~+700 bytes — do not add it.
  "-Oz", "--flatten", "--rereloop", "-Oz", "--converge", "--strip-producers",
  # Rust 1.88+ emits post-MVP WASM features; each must be explicitly enabled.
  # Requires Binaryen: CI uses phi-ag/setup-binaryen v129; locally `brew install binaryen`.
  "--enable-bulk-memory", "--enable-sign-ext", "--enable-nontrapping-float-to-int",
  "--enable-mutable-globals",
]
