[workspace]
members = ["crates/mds-core", "crates/mds-cli", "crates/mds-wasm", "crates/mds-napi", "crates/mds-python", "crates/mds-fetch"]
resolver = "2"

[workspace.package]
version = "0.7.0"
edition = "2021"
rust-version = "1.88" # napi 3.12.2 sets rust-version = "1.88" in its published Cargo.toml
license = "MIT"
readme = "README.md"
repository = "https://github.com/dean0x/mdscript"
keywords = ["markdown", "template", "llm", "prompt", "compiler"]

[workspace.dependencies]
indexmap = "2.2"
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
serde_json = "1"
miette = { version = "7" }
thiserror = "2"
clap = { version = "4", features = ["derive"] }
# tempfile: mds-cli's Windows replace (#160) makes its temporary file with
# `Builder::make_in` (3.4.0) and keeps it with `disable_cleanup` (3.20.0).
tempfile = "3.20"
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
wasm-bindgen-test = "0.3"
js-sys = "0.3"
napi = { version = "3.12.2", default-features = false, features = ["napi3", "serde-json"] }
napi-derive = "3.6.3"
napi-build = "2.4.1"
# Python bindings (crates/mds-python). Pins are exact and soak-checked (2026-09-06):
# pyo3 0.29.0 patches two RustSec advisories disclosed 2026-06-11 — RUSTSEC-2026-0176
# (OOB read in PyList/PyTuple iterator nth/nth_back) and RUSTSEC-2026-0177 (missing
# Sync bound on PyCFunction::new_closure, a free-threading soundness gap this crate is
# directly exposed to via `gil_used = false` below). Both are fixed only in >=0.29.0.
# 0.29.2 is a patch on the already-fixed 0.29 line (both advisories remain fixed);
# published 2026-08-05 (32 days of soak at 2026-09-06), past the routine 30d window.
# It is the newest patch available — no 0.29.x above 0.29.2 exists. `abi3-py311` is
# ALWAYS on (not optional) so `cargo build/clippy/test --workspace` compile the cdylib
# against the stable ABI without linking libpython or needing a Python interpreter.
# `extension-module` is gated behind the crate's own default feature so it can be
# toggled off. pyo3 default features (incl. `macros`) are kept. pythonize's minor must
# track pyo3's (0.29 ↔ 0.29); no 0.29.x above 0.29.0 exists for pythonize — pin stays.
pyo3 = { version = "=0.29.3", features = ["abi3-py311"] }
pythonize = "=0.29.0"
# notify is CC0-1.0 (public-domain dedication). CC0 is permissive and non-contaminating
# with respect to the workspace MIT license. Explicitly accepted here.
# notify and ctrlc also introduce additional transitive license families (platform-specific):
#   - inotify 0.11.1 / inotify-sys 0.1.5 → ISC (Linux only)
#   - dispatch2 0.3.1 → Zlib OR Apache-2.0 OR MIT (macOS only, via ctrlc)
# ISC and Zlib are permissive and MIT-compatible; no copyleft or contamination risk.
# All three families are explicitly accepted here.
# See deny.toml for the license policy that CI applies (#136).
notify = "8"
ctrlc = "3.5"
# similar: pure-Rust diffing (mds-cli `fmt --diff`). Apache-2.0 (MIT-compatible, no
# copyleft). 3.2.0 released 2026-08-17 (20d soak at 2026-09-06) — within the one-off
# 14-day flush rule for this batch. rust-version = "1.85" in its published Cargo.toml,
# within the workspace MSRV (1.88). Only the default features ("std", "text") are used.
similar = "3.1"
# rustix: the directory-relative calls mds-cli's unix write primitive walks below an
# output's anchor with, never following a symlink there (#160): `openat`, `mkdirat`,
# `statat`, `fstat`, `fchmod`, `fsync`, `unlinkat`, `linkat`, `renameat` and `renameat_with`
# with `RenameFlags::NOREPLACE`, and `OFlags::PATH` for the search-only open of a directory
# on Linux and Android. `renameat_with` and `RenameFlags` exist only on the targets rustix
# cfgs as `apple` or `linux_kernel`; `rename_noreplace` in `crates/mds-cli/src/write.rs`
# repeats that target list in its own `cfg` attributes, and its `SEARCH` constant repeats a
# subset of the targets that define `OFlags::PATH`. On every rustix bump, check that each
# call above still exists and that both target lists still match rustix's.
# Already in Cargo.lock through tempfile, at the version pinned here, so it adds a
# dependency edge and no package. Apache-2.0 WITH LLVM-exception OR Apache-2.0 OR MIT;
# rust-version 1.63, within the workspace MSRV.
rustix = { version = "1.1.4", default-features = false, features = ["fs", "std"] }
# The sender of URL data entries (crates/mds-fetch). Pins are exact and soak-checked on
# the crates.io API (2026-11-25; cut-off 2026-10-26). mds-core and mds-wasm never depend
# on these crates (crates/mds-core/tests/supply_chain.rs).
# ureq 3.5.0: blocking HTTP/1.1 client, MIT OR Apache-2.0, published 2026-10-21 (35 d).
# No default features: `rustls-no-provider` gives the rustls connector with no gzip, no
# root list and no crypto provider; mds-fetch sets each one itself. Its `unversioned`
# resolver and connector API can change in a minor release, so the pin is exact: review
# the adapter in crates/mds-fetch/src/send.rs on each bump.
ureq = { version = "=3.5.0", default-features = false, features = ["rustls-no-provider"] }
# rustls 0.23.46: TLS 1.2 and 1.3 with the ring provider (C compiler only, no cmake or
# nasm). Apache-2.0 OR ISC OR MIT, published 2026-10-14 (42 d). It is the first version
# with the fixes of four 2026 rustls advisories: do not take a lower version.
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
# webpki-root-certs 1.0.11: the Mozilla root list as DER certificates, so host roots can
# join it. CDLA-Permissive-2.0, a permissive data license with no copyleft (one-crate
# exception in deny.toml). Published 2026-10-23 (33 d).
webpki-root-certs = "=1.0.11"
# rcgen 0.14.10: test-only. The TLS tests of mds-fetch make their CA, certificate and key
# at test time, so the repository holds no key. MIT OR Apache-2.0, published 2026-08-28
# (89 d), rust-version 1.88. The ring provider only (no aws-lc-rs); `pem` writes the PEM
# form of a host root.
rcgen = { version = "=0.14.10", default-features = false, features = ["ring", "pem"] }

# panic = "unwind" is required workspace-wide because mds-napi and mds-python catch
# panics with catch_unwind at the host boundary and return `mds::internal` errors, and
# mds-cli catches a panic in `output::catch_panic`. Cargo does not support per-package
# panic strategy overrides for workspace profiles.
# This setting does not make mds-wasm unwind: wasm32-unknown-unknown cannot unwind, so
# a panic there traps (a JS `RuntimeError`, "unreachable") and the catch_unwind in
# mds-wasm does not catch it.
# Note: "unwind" is already Rust's default for dev, so the dev setting is
# explicit documentation only.
[profile.dev]
panic = "unwind"

[profile.release]
lto = true
panic = "unwind" # required by the native catch_unwind boundaries; see comment above

# codegen-units here applies to the mds-wasm crate only. The WASM build commands add
# `--config profile.release.codegen-units=1`, which gives mds-core and every
# dependency one unit in that build only (#491; see the wasm job in ci.yml).
[profile.release.package.mds-wasm]
opt-level = "z"
strip = true
codegen-units = 1

[profile.release.package.mds-napi]
opt-level = 3
strip = true
codegen-units = 1

[profile.release.package.mds-python]
opt-level = "z"
strip = true
codegen-units = 1
