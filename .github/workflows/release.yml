name: Release

# Two entry points:
#   * push a version tag (v*) -> full coordinated release
#   * workflow_dispatch (no inputs) -> dry run (build + verify, no publish)
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: read

# cancel-in-progress: false is LOAD-BEARING: setting true would cancel a run
# mid-sequence (e.g., between cargo publish and npm publish). A cancelled run
# reads as "not failing" (PF-017), which would let --admin merge bypass the CI
# gate and could manufacture the partial-publish state reliability-05 guards against.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # D1 — version-consistency gate. Cheap; fails fast before any build/publish.
  # ---------------------------------------------------------------------------
  version-gate:
    name: Version gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read  # needed to call the check-runs API in the CI-history step
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v6
        with: { node-version: 22, registry-url: "https://registry.npmjs.org" }
      - name: "Verify publish credentials before irreversible steps (security-08)"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          CARGO_REG_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          # Guard: npm token must be non-empty. A missing or revoked secret interpolates
          # to an empty string in GitHub Actions — not an error — so this must be checked
          # explicitly before cargo publish runs and makes crates.io publish irreversible.
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_TOKEN is empty or unset — npm publish would fail AFTER cargo publish (irreversible). Set the NPM_TOKEN repo secret. (security-08)"
            exit 1
          fi
          # Guard: cargo token must be non-empty. A missing token fails before the
          # irreversible crates.io publish, but catching it here avoids burning the
          # expensive 7-target cross-compile matrix.
          if [ -z "$CARGO_REG_TOKEN" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN is empty or unset — cargo publish would fail. Set the CARGO_REGISTRY_TOKEN repo secret. (security-08)"
            exit 1
          fi
          # Verify npm authentication: whoami proves the token is accepted by the registry.
          # NOTE: this verifies authentication only, NOT publish rights to @mdscript scope.
          # A read-only or wrongly-scoped token passes this check but fails at publish time.
          WHO=$(npm whoami --registry https://registry.npmjs.org 2>&1) || {
            echo "::error::npm whoami failed — NPM_TOKEN may be revoked or expired: ${WHO}"
            exit 1
          }
          echo "npm credentials verified: token resolves to npm user '${WHO}'"
      - name: "Assert synchronized versions, no file: refs"
        run: node scripts/verify-versions.mjs
      # #288: Source-hygiene gate — also runs on tag pushes via this job.
      # ci.yml does not run on tag pushes, so these two steps ensure the full
      # gate (scanner + positive-control suite) is enforced at release time.
      # test:gates enforces a minimum spec count (>=3) so the suite cannot
      # be silently skipped on the release path (ADR-009/PF-013).
      # Uses the same Node 22 install above.
      - name: "Assert no hazardous codepoints in tracked source"
        run: node scripts/verify-no-control-bytes.mjs
      - name: "Run positive-control and class-completeness suite"
        run: npm run test:gates
      # reliability-12: assert the tagged SHA went green in CI before any
      # irreversible publish starts. Only runs on tag pushes (not workflow_dispatch
      # dry runs, which have no prior CI record to verify).
      # Reads required contexts from main branch protection (D-PR2; avoids ADR-009
      # vacuous-green). Treats CANCELLED/skipped/in_progress as failure (PF-017).
      # Cannot reuse scripts/verify-pr-checks.mjs here — that script requires a PR
      # number, and tag pushes reference a commit, not a PR. Uses the check-runs API
      # directly against github.sha with the same fail-closed semantics.
      - name: "Assert tagged SHA has green CI history (PF-017)"
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="${{ github.sha }}"
          REPO="${{ github.repository }}"

          # Read required contexts from main branch protection (D-PR2). Fail closed
          # if protection is unreadable or lists zero contexts — an empty required
          # set is a vacuous pass, not a pass (ADR-009).
          if ! PROT=$(gh api "/repos/${REPO}/branches/main/protection"); then
            echo "::error::Cannot read main branch protection (check token permissions)"
            exit 1
          fi
          CONTEXTS_JSON=$(echo "$PROT" | jq '[
            (.required_status_checks.contexts // []),
            ((.required_status_checks.checks // [])
              | map(.context)
              | map(select(. != null)))
          ] | flatten | unique')
          REQ_COUNT=$(echo "$CONTEXTS_JSON" | jq 'length')
          if [ "$REQ_COUNT" -eq 0 ]; then
            echo "::error::main protection lists 0 required contexts — indeterminate (ADR-009)"
            exit 1
          fi
          echo "Required contexts from main (${REQ_COUNT}):"
          echo "$CONTEXTS_JSON" | jq -r '.[]' | sed 's/^/  /'

          # Fetch check-runs for the tagged SHA. Bounded at 3 pages × 100 = 300
          # runs — far above any expected CI suite size. filter=latest
          # de-duplicates runs within each check-suite (D-PR4a parity).
          ALL_RUNS="[]"
          for _page in 1 2 3; do
            BATCH=$(gh api \
              "/repos/${REPO}/commits/${SHA}/check-runs?per_page=100&page=${_page}&filter=latest" \
              --jq '.check_runs // []') || {
              echo "::error::check-runs API error (page ${_page})"
              exit 1
            }
            LEN=$(echo "$BATCH" | jq 'length')
            ALL_RUNS=$(printf '%s\n%s' "$ALL_RUNS" "$BATCH" | jq -sc 'add // []')
            [ "$LEN" -lt 100 ] && break
          done

          TOTAL=$(echo "$ALL_RUNS" | jq 'length')
          if [ "$TOTAL" -eq 0 ]; then
            echo "::error::Zero check-runs for ${SHA} — no CI record (PF-013: absence is not success)"
            exit 1
          fi
          echo "${TOTAL} check-run(s) found for ${SHA}"

          # Assert each required context is completed+success.
          # PF-017: CANCELLED / skipped / in_progress / null are all FAIL.
          FAIL=0
          while IFS= read -r ctx; do
            [ -z "$ctx" ] && continue
            VERDICT=$(echo "$ALL_RUNS" | jq -r --arg c "$ctx" \
              'map(select(.name == $c)) |
               if length == 0 then "absent"
               else .[0] | "\(.status)/\(.conclusion // "null")"
               end')
            if [ "$VERDICT" = "absent" ]; then
              echo "::error::Required '${ctx}' — not found in check-runs (never ran)"
              FAIL=1
            elif [ "$VERDICT" = "completed/success" ]; then
              echo "  ok: '${ctx}'"
            else
              echo "::error::Required '${ctx}' — ${VERDICT} (PF-017: only completed/success passes)"
              FAIL=1
            fi
          done < <(echo "$CONTEXTS_JSON" | jq -r '.[]')

          [ "$FAIL" -ne 0 ] && exit 1
          echo "All ${REQ_COUNT} required context(s) completed+success for ${SHA} — CI-verified"

  # ---------------------------------------------------------------------------
  # A6 — cross-compile the native addon for all 7 targets.
  # Linux legs: x86_64-gnu uses napi's --use-napi-cross (gnu sysroot);
  # aarch64-gnu links with the apt cross gcc (the macOS-generated lockfile
  # lacks linux @napi-rs/tar so @napi-rs/cross-toolchain cannot reify);
  # BOTH musl legs link with a zig cc wrapper because --use-napi-cross has
  # no musl toolchain and napi forces -C target-feature=-crt-static on musl,
  # so the host gcc would link glibc (see x86_64-unknown-linux-musl).
  # macOS x86_64 cross-links from the arm64 host via the installed target.
  # `--no-js` preserves the hand-written index.js loader (index.d.ts still
  # regenerates).
  # ---------------------------------------------------------------------------
  build-napi:
    name: Build napi (${{ matrix.settings.target }})
    needs: [version-gate]
    if: ${{ !cancelled() && needs.version-gate.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-latest
            target: aarch64-apple-darwin
            build: napi build --platform --release --target aarch64-apple-darwin --no-js
          - host: macos-latest
            target: x86_64-apple-darwin
            build: napi build --platform --release --target x86_64-apple-darwin --no-js
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            build: napi build --platform --release --target x86_64-unknown-linux-gnu --use-napi-cross --no-js
          - host: ubuntu-latest
            target: x86_64-unknown-linux-musl
            build: napi build --platform --release --target x86_64-unknown-linux-musl --no-js
            use-zig: true
            setup: |
              # --use-napi-cross supports gnu triples only: @napi-rs/cross-toolchain
              # has no musl entry, so napi warned "Unsupported arch: x64 triple:
              # x86_64-unknown-linux-musl", swallowed it, and built the musl target
              # with the host gcc. Because napi forces -C target-feature=-crt-static
              # on every musl ABI (a cdylib cannot use crt-static), rustc's
              # self-contained musl libc is off too, so that link resolved -lc
              # against the runner's glibc: v0.1.0-v0.3.0 shipped a linux-x64-musl
              # addon needing libc.so.6 / GLIBC_2.34 (rust-lang/rust#135244).
              # zig cc supplies musl, exactly as on aarch64-musl. No arg
              # filter here: of the flags zig cc's allowlist rejects,
              # --fix-cortex-a53-843419 is aarch64-only, and
              # -Wl,-znostart-stop-gc (also rejected by zig 0.16.0;
              # cargo-zigbuild filters both in src/zig/linker_args.rs)
              # is gated by rustc to llvm_target x86_64-unknown-linux-gnu
              # (rust-lang/rust#137685). If a future rustc widens that
              # gate this leg fails with "unsupported linker extension
              # flag: -z nostart-stop-gc".
              cat > /tmp/zig-cc-x86_64-musl <<'ZIGCC'
              #!/bin/sh
              exec zig cc -target x86_64-linux-musl "$@"
              ZIGCC
              chmod +x /tmp/zig-cc-x86_64-musl
              echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=/tmp/zig-cc-x86_64-musl" >> "$GITHUB_ENV"
          - host: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            build: napi build --platform --release --target aarch64-unknown-linux-gnu --no-js
            setup: |
              sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
              echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          - host: ubuntu-latest
            target: aarch64-unknown-linux-musl
            build: napi build --platform --release --target aarch64-unknown-linux-musl --no-js
            use-zig: true
            setup: |
              # rustc 1.98.0 (rust-lang/rust#155453) passes -Wl,--fix-cortex-a53-843419 for
              # both aarch64 linux targets. GNU ld accepts it (the -gnu leg builds); zig cc
              # rejects any -Wl, arg missing from its own allowlist before lld sees it, and no
              # released zig accepts this one (ziglang/zig#36624 on Codeberg, open). lld never
              # applies the erratum fix by default, so no zig-linked artifact we have shipped
              # ever carried it; stripping restores v0.3.0 behaviour. Same remedy as
              # cargo-zigbuild#452. The loop is bounded: exactly $# iterations, order kept.
              cat > /tmp/zig-cc-aarch64-musl <<'ZIGCC'
              #!/bin/sh
              n=$#
              i=0
              while [ "$i" -lt "$n" ]; do
                arg=$1
                shift
                i=$((i + 1))
                case "$arg" in
                  -Wl,--fix-cortex-a53-843419|--fix-cortex-a53-843419) ;;
                  *) set -- "$@" "$arg" ;;
                esac
              done
              exec zig cc -target aarch64-linux-musl "$@"
              ZIGCC
              chmod +x /tmp/zig-cc-aarch64-musl
              # Self-check with a fake zig: a silently broken filter must fail here, not at
              # link time (positive control: the flag is present on input and must be gone).
              mkdir -p /tmp/fakezig
              printf '#!/bin/sh\nprintf "%%s\\n" "$@"\n' > /tmp/fakezig/zig
              chmod +x /tmp/fakezig/zig
              OUT=$(PATH=/tmp/fakezig:$PATH /tmp/zig-cc-aarch64-musl -Wl,--fix-cortex-a53-843419 -o out.so obj.o)
              echo "$OUT" | grep -q 843419 && { echo "::error::zig wrapper failed to strip --fix-cortex-a53-843419"; exit 1; }
              echo "$OUT" | grep -qx -- '-o' || { echo "::error::zig wrapper dropped unrelated args"; exit 1; }
              rm -rf /tmp/fakezig
              echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=/tmp/zig-cc-aarch64-musl" >> "$GITHUB_ENV"
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            build: napi build --platform --release --target x86_64-pc-windows-msvc --no-js
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install zig
        if: matrix.settings.use-zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Setup cross-compilation tools
        if: matrix.settings.setup
        run: ${{ matrix.settings.setup }}
      - run: npm ci
      - name: Build addon
        working-directory: crates/mds-napi
        run: npx ${{ matrix.settings.build }}
      - name: Assert musl artifact links musl, not glibc
        if: ${{ endsWith(matrix.settings.target, '-linux-musl') }}
        working-directory: crates/mds-napi
        run: |
          # Detector self-test: the glibc pattern must fire on a planted glibc
          # NEEDED line, so a silently broken pattern cannot read as "clean".
          printf ' 0x0000000000000001 (NEEDED) Shared library: [libc.so.6]\n' \
            | grep -Eq 'libc\.so\.6|ld-linux' \
            || { echo "::error::glibc detector self-test failed to fire"; exit 1; }
          set -- *.node
          [ "$#" -eq 1 ] || { echo "::error::expected exactly one .node artifact, found $#: $*"; exit 1; }
          node_file=$1
          readelf -d "$node_file" > /tmp/dyn.txt
          # Non-vacuity guard: readelf must have produced NEEDED entries at all.
          grep -q 'NEEDED' /tmp/dyn.txt || { echo "::error::no NEEDED entries parsed from $node_file"; exit 1; }
          if grep -Eq 'libc\.so\.6|ld-linux' /tmp/dyn.txt; then
            echo "::error::$node_file is glibc-linked; expected musl (libc.so)"
            cat /tmp/dyn.txt
            exit 1
          fi
          # Positive assertion: a musl cdylib links musl's libc by its
          # soname libc.so.
          grep -q 'Shared library: \[libc\.so\]' /tmp/dyn.txt || {
            echo "::error::$node_file does not link musl libc.so"
            cat /tmp/dyn.txt
            exit 1
          }
          cat /tmp/dyn.txt
      - uses: actions/upload-artifact@v7
        with:
          name: bindings-${{ matrix.settings.target }}
          path: crates/mds-napi/*.node
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # A3/A7/D2 — stage the per-platform npm packages from the built .node files,
  # then run the CRITICAL name<->loader gate. Runs on BOTH tag push and the
  # workflow_dispatch dry run; it never publishes. The publish job consumes the
  # exact staged tree this job uploads.
  # ---------------------------------------------------------------------------
  stage-and-verify-napi:
    name: Stage + verify platform packages
    needs: [build-napi]
    if: ${{ !cancelled() && needs.build-napi.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Download all .node artifacts
        uses: actions/download-artifact@v8
        with:
          path: crates/mds-napi/artifacts
          pattern: bindings-*
          merge-multiple: true
      - name: Stage per-platform packages
        working-directory: crates/mds-napi
        run: |
          npx napi create-npm-dirs
          npx napi artifacts --output-dir .
      - name: Copy LICENSE into each platform package
        run: for d in crates/mds-napi/npm/*/; do cp LICENSE "$d"; done
      - name: A3 — name <-> loader verification gate
        run: node scripts/verify-napi-names.mjs
      - name: Upload staged napi tree
        uses: actions/upload-artifact@v7
        with:
          name: napi-staged
          path: |
            crates/mds-napi/npm/**
            crates/mds-napi/*.node

  # ===========================================================================
  # Everything below publishes — gated to tag pushes only.
  # workflow_dispatch (no inputs) stops above; publish jobs see a non-tag ref
  # and their startsWith(github.ref, 'refs/tags/v') condition evaluates false.
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # crates.io — library then CLI (CLI depends on the library; order + index
  # propagation matter). Requires repo secret CARGO_REGISTRY_TOKEN.
  # ---------------------------------------------------------------------------
  publish-crates:
    name: Publish to crates.io
    # stage-and-verify-napi is listed here so the critical A3 name<->loader gate
    # (RELEASING.md "hard checkpoint") must pass before crates.io (irreversible)
    # publishes. Without this, the 7-target napi matrix can still be running while
    # crates.io is already live at the new version.
    needs: [version-gate, stage-and-verify-napi]
    if: ${{ !cancelled() && needs.version-gate.result == 'success' && needs.stage-and-verify-napi.result == 'success' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify tag matches workspace version
        run: |
          TAG="${{ github.ref_name }}"
          TAG="${TAG#v}"
          CRATE_VER="$(cargo metadata --no-deps --format-version 1 \
            | grep -o '"name":"mds-core","version":"[^"]*"' \
            | grep -o '[0-9][^"]*' | head -1)"
          echo "tag=$TAG crate=$CRATE_VER"
          test "$TAG" = "$CRATE_VER" || { echo "::error::tag v$TAG != crate version $CRATE_VER"; exit 1; }
      - name: Publish mds-core
        run: |
          # Idempotency: a re-run where the version is already published should pass.
          # Any other failure (bad token, outage, genuine version conflict) must fail loudly.
          if OUTPUT=$(cargo publish -p mds-core --token "${{ secrets.CARGO_REGISTRY_TOKEN }}" 2>&1); then
            echo "$OUTPUT"
          elif echo "$OUTPUT" | grep -qE "already (uploaded|exists|published)"; then
            echo "::notice::mds-core already published — idempotent re-run, skipping"
            echo "$OUTPUT"
          else
            echo "::error::mds-core publish failed"
            echo "$OUTPUT"
            exit 1
          fi
      - name: Wait for crates.io index to update
        run: |
          # Bounded poll — max 20 attempts × 15 s = 300 s (5 min), then fail with
          # a clear message. Avoids the former unbounded sleep 30 that silently
          # masked races on slow registry propagation.
          VERSION=$(cargo metadata --no-deps --format-version 1 \
            | grep -o '"name":"mds-core","version":"[^"]*"' \
            | grep -o '[0-9][^"]*' | head -1)
          echo "Polling crates.io for mds-core@${VERSION} (max 20 × 15 s)"
          MAX=20
          for i in $(seq 1 "$MAX"); do
            if curl -sf --max-time 20 --connect-timeout 10 \
                 "https://crates.io/api/v1/crates/mds-core/${VERSION}" \
                 -H "User-Agent: mds-release-ci/1.0" \
                 | grep -qF "\"num\":\"${VERSION}\""; then
              echo "mds-core@${VERSION} is visible in crates.io (attempt $i/$MAX)"
              exit 0
            fi
            echo "  Attempt $i/$MAX: not yet visible — sleeping 15 s..."
            sleep 15
          done
          echo "::error::mds-core@${VERSION} not visible in crates.io after $((MAX * 15)) s"
          exit 1
      - name: Publish mds-cli
        run: |
          # Same idempotency guard as mds-core above.
          if OUTPUT=$(cargo publish -p mds-cli --token "${{ secrets.CARGO_REGISTRY_TOKEN }}" 2>&1); then
            echo "$OUTPUT"
          elif echo "$OUTPUT" | grep -qE "already (uploaded|exists|published)"; then
            echo "::notice::mds-cli already published — idempotent re-run, skipping"
            echo "$OUTPUT"
          else
            echo "::error::mds-cli publish failed"
            echo "$OUTPUT"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # A7/B4/D3 — publish all npm packages with provenance (OIDC).
  # NPM_CONFIG_PROVENANCE=true makes every `npm publish` (including the ones napi
  # prepublish runs for the platform packages) emit a provenance attestation.
  # ---------------------------------------------------------------------------
  publish-npm:
    name: Publish to npm
    needs: [stage-and-verify-napi, publish-crates]
    if: ${{ !cancelled() && needs.stage-and-verify-napi.result == 'success' && needs.publish-crates.result == 'success' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC for npm provenance
      contents: read
    env:
      NPM_CONFIG_PROVENANCE: "true"
      NPM_CONFIG_ACCESS: "public"
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          registry-url: "https://registry.npmjs.org"
      # performance-01 / PF-021: pin to the same 1.96.0 SHA that ci.yml's wasm
      # job uses so the compiler that MEASURES size and the compiler that BUILDS
      # the published artifact are identical. Unpinned @stable lets toolchain
      # drift silently push the binary past the 850 KB guard between releases.
      # WHEN BUMPING: update ci.yml's wasm job pin first, re-measure, then
      # update here to keep both in sync.
      - uses: dtolnay/rust-toolchain@01ba1edad32c6f80dbcce879d3e0fa5a00b2a84e  # 1.96.0
        with: { targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/setup-wasm
      - run: npm ci
      - name: Restore staged napi tree (.node + npm/ platform dirs)
        uses: actions/download-artifact@v8
        with:
          name: napi-staged
          path: crates/mds-napi
      # A4 — regenerate index.d.ts on the publish host (hand-written index.js is
      # preserved by --no-js); the stray host .node is not in the package `files`.
      - name: Generate napi types
        working-directory: crates/mds-napi
        run: npx napi build --platform --release --no-js
      - name: Re-run A3 gate against the restored tree
        run: node scripts/verify-napi-names.mjs
      # Build all artifacts BEFORE the first irreversible publish. A tsc/wasm-opt
      # failure after any npm publish leaves partial state that cannot be healed
      # without a manual laptop publish (which loses OIDC provenance).
      - name: Build WASM + TS packages
        run: |
          npm run build -w @mdscript/mds-wasm
          npm run build --workspaces --if-present
      # performance-01 / PF-021: defence-in-depth size guard on the ACTUAL
      # published artifact (built above by the pinned 1.96.0 toolchain). Mirrors
      # ci.yml's 850,000-byte threshold byte-for-byte. Runs BEFORE any irreversible
      # npm publish so a bloated binary aborts before anything reaches the registry.
      - name: "Assert WASM binary size < 850,000 bytes (PF-021)"
        run: |
          for f in packages/mds-wasm/dist/node/mds_wasm_bg.wasm \
                   packages/mds-wasm/dist/web/mds_wasm_bg.wasm; do
            if [ ! -f "$f" ]; then
              echo "::error::WASM file missing: $f"
              exit 1
            fi
            raw=$(wc -c < "$f" | tr -d ' ')
            echo "::notice::WASM ${f}: ${raw} bytes"
            if [ "$raw" -gt 850000 ]; then
              echo "::error::WASM binary exceeds 850,000 byte threshold: ${f} is ${raw} bytes"
              exit 1
            fi
          done
      - name: Publish platform packages (napi prepublish)
        working-directory: crates/mds-napi
        run: |
          # Idempotency: a re-run finds already-published platform packages and
          # returns E403. Tolerate E403-only failures; any other error fails loudly.
          # Do NOT use continue-on-error: it converts a hard failure into a silent
          # partial release unrecoverable without a manual laptop publish (which
          # loses OIDC provenance). PF-023.
          if OUTPUT=$(npx napi prepublish -t npm 2>&1); then
            echo "$OUTPUT"
          else
            NON_E403=$(echo "$OUTPUT" | grep -i "npm error" | grep -vi "E403" || true)
            if [ -n "$NON_E403" ]; then
              echo "::error::napi prepublish failed with non-E403 errors"
              echo "$OUTPUT"
              exit 1
            fi
            echo "::notice::All platform packages already published (E403) — idempotent re-run, skipping"
            echo "$OUTPUT"
          fi
      - name: Publish npm packages
        run: |
          # Idempotency: publish_if_absent checks npm view before publishing so
          # a re-run skips already-published versions without swallowing genuine
          # failures. Never use continue-on-error — it masks partial state. PF-023.
          VER="${{ github.ref_name }}"
          VER="${VER#v}"
          publish_if_absent() {
            local pkg="$1"
            if npm view "${pkg}@${VER}" version >/dev/null 2>&1; then
              echo "::notice::${pkg}@${VER} already published — idempotent re-run, skipping"
              return 0
            fi
            if OUTPUT=$(npm publish -w "${pkg}" --access public 2>&1); then
              echo "$OUTPUT"
            else
              echo "::error::${pkg}@${VER} publish failed"
              echo "$OUTPUT"
              exit 1
            fi
          }
          publish_if_absent "@mdscript/mds-napi"
          publish_if_absent "@mdscript/mds-wasm"
          publish_if_absent "@mdscript/mds"
          publish_if_absent "@mdscript/bundler-utils"
          publish_if_absent "@mdscript/vite-plugin"
          publish_if_absent "@mdscript/rollup-plugin"
          publish_if_absent "@mdscript/webpack-loader"
          publish_if_absent "@mdscript/rspack-loader"

  # ---------------------------------------------------------------------------
  # GitHub Release — cut last, after crates + npm succeed.
  # ---------------------------------------------------------------------------
  github-release:
    name: GitHub Release
    needs: [publish-crates, publish-npm]
    if: ${{ !cancelled() && needs.publish-crates.result == 'success' && needs.publish-npm.result == 'success' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
      - name: Create release
        run: |
          TAG="${{ github.ref_name }}"
          gh release create "$TAG" --title "$TAG" --generate-notes 2>&1 \
            || gh release edit "$TAG" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
