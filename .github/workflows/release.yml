name: Release

# Two entry points:
#   * push a version tag (v*) -> full coordinated release
#   * workflow_dispatch (no inputs) -> dry run (build + verify, no publish)
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: read

# cancel-in-progress: false is LOAD-BEARING: setting true would cancel a run
# mid-sequence (e.g., between cargo publish and npm publish). A cancelled run
# reads as "not failing" (PF-017), which would let --admin merge bypass the CI
# gate and could manufacture the partial-publish state reliability-05 guards against.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # D1 — version-consistency gate. Cheap; fails fast before any build/publish.
  # ---------------------------------------------------------------------------
  version-gate:
    name: Version gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read   # commit check/status reads
      actions: read  # CI workflow runs + their jobs, for the CI-history step
      id-token: write # OIDC for PyPI trusted publisher probe (F5, security-08)
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v6
        with: { node-version: 22, registry-url: "https://registry.npmjs.org" }
      - name: "Verify publish credentials before irreversible steps (security-08)"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          CARGO_REG_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          # Guard: npm token must be non-empty. A missing or revoked secret interpolates
          # to an empty string in GitHub Actions — not an error — so this must be checked
          # explicitly before cargo publish runs and makes crates.io publish irreversible.
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_TOKEN is empty or unset — npm publish would fail AFTER cargo publish (irreversible). Set the NPM_TOKEN repo secret. (security-08)"
            exit 1
          fi
          # Guard: cargo token must be non-empty. A missing token fails before the
          # irreversible crates.io publish, but catching it here avoids burning the
          # expensive 7-target cross-compile matrix.
          if [ -z "$CARGO_REG_TOKEN" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN is empty or unset — cargo publish would fail. Set the CARGO_REGISTRY_TOKEN repo secret. (security-08)"
            exit 1
          fi
          # Verify npm authentication: whoami proves the token is accepted by the registry.
          # NOTE: this verifies authentication only, NOT publish rights to @mdscript scope.
          # A read-only or wrongly-scoped token passes this check but fails at publish time.
          WHO=$(npm whoami --registry https://registry.npmjs.org 2>&1) || {
            echo "::error::npm whoami failed — NPM_TOKEN may be revoked or expired: ${WHO}"
            exit 1
          }
          echo "npm credentials verified: token resolves to npm user '${WHO}'"
      # PyPI OIDC trusted-publisher probe (F5, security-08). The mint-token
      # exchange is free and idempotent — the minted token is simply unused here.
      # NOT tag-guarded: this step must run in the workflow_dispatch dry run
      # (PF-039) so a misconfigured or expired trusted publisher is caught BEFORE
      # any irreversible crates.io publish. version-gate has id-token: write above.
      - name: "Verify PyPI trusted publisher before irreversible steps (security-08)"
        shell: bash
        run: |
          set -euo pipefail
          RESP=$(curl -sS "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=pypi" \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}")
          TOK=$(echo "$RESP" | jq -r '.value')
          CODE=$(curl -sS -o /tmp/mint.json -w '%{http_code}' \
            -X POST https://pypi.org/_/oidc/mint-token \
            -d "{\"token\":\"${TOK}\"}")
          [ "$CODE" = "200" ] || {
            echo "::error::PyPI OIDC mint failed (HTTP $CODE) — trusted publisher missing, expired, or mismatched. Fix BEFORE tagging; crates.io is irreversible."
            jq -r '.message // .' /tmp/mint.json; exit 1; }
          echo "PyPI trusted publisher OK"
      - name: "Assert synchronized versions, no file: refs"
        run: node scripts/verify-versions.mjs
      # #288: Source-hygiene gate — also runs on tag pushes via this job.
      # ci.yml does not run on tag pushes, so these two steps ensure the full
      # gate (scanner + positive-control suite) is enforced at release time.
      # test:gates enforces a minimum spec count (>=3) so the suite cannot
      # be silently skipped on the release path (ADR-009/PF-013).
      # Uses the same Node 22 install above.
      - name: "Assert no hazardous codepoints in tracked source"
        run: node scripts/verify-no-control-bytes.mjs
      - name: "Run positive-control and class-completeness suite"
        run: npm run test:gates
      # reliability-12: assert the SHA being released went green in CI before
      # any irreversible publish starts. Runs on BOTH triggers - a tag push
      # verifies the tagged commit, a workflow_dispatch dry run verifies the
      # dispatched ref's HEAD - so the dry run now exercises this gate instead
      # of skipping it. Cancelled, failed, in-progress and absent runs all fail
      # closed (PF-017; PF-013: absence is not success).
      # Cannot reuse scripts/verify-pr-checks.mjs here - that script requires a
      # PR number, and tag pushes reference a commit, not a PR.
      # Branch protection is NOT read: /branches/main/protection needs
      # repository administration rights, which the workflow token can never
      # hold (it returned HTTP 403 on the v0.4.0 tag push). ADR-013's
      # required-context count is mirrored into MIN_CI_JOBS below instead.
      - name: "Assert tagged SHA has green CI history (PF-017)"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA="${{ github.sha }}"
          REPO="${{ github.repository }}"

          # MIN_CI_JOBS mirrors the 15 required contexts in main's branch
          # protection and EXPECTED_CONTEXTS in scripts/verify-pr-checks.mjs.
          # ADR-013: adding a CI job is a multi-place change - bump this floor
          # when the required set grows.
          MIN_CI_JOBS=15

          # Bounded: one page of 50 is far above the number of CI runs a single
          # commit can accumulate.
          if ! RUNS=$(gh api \
            "/repos/${REPO}/actions/workflows/ci.yml/runs?head_sha=${SHA}&per_page=50" \
            --jq '.workflow_runs'); then
            echo "::error::CI workflow-runs API error for ${SHA}"
            exit 1
          fi

          TOTAL=$(echo "$RUNS" | jq 'length')
          if [ "$TOTAL" -eq 0 ]; then
            echo "::error::No CI workflow run for ${SHA} (PF-013: absence is not success)"
            exit 1
          fi
          echo "${TOTAL} CI workflow run(s) found for ${SHA}"

          # A commit whose CI has not finished is indeterminate, not green.
          COMPLETED=$(echo "$RUNS" | jq '[.[] | select(.status == "completed")] | length')
          PENDING=$(echo "$RUNS" | jq '[.[]
            | select(.status == "queued" or .status == "in_progress")] | length')
          if [ "$COMPLETED" -eq 0 ] && [ "$PENDING" -gt 0 ]; then
            echo "::error::CI for ${SHA} is still running - wait for it to complete, then re-run (PF-017)"
            exit 1
          fi

          # PF-017: only completed+success counts. Take the most recent one.
          RUN_ID=$(echo "$RUNS" | jq -r '[.[]
            | select(.status == "completed" and .conclusion == "success")]
            | max_by(.id) | .id // empty')
          if [ -z "$RUN_ID" ]; then
            echo "$RUNS" | jq -r '.[]
              | "  \(.id) event=\(.event) status=\(.status) conclusion=\(.conclusion // "null")"'
            echo "::error::No completed+success CI run for ${SHA} (cancelled/failed/in_progress are not success - PF-017)"
            exit 1
          fi
          RUN_URL=$(echo "$RUNS" | jq -r --argjson id "$RUN_ID" \
            '.[] | select(.id == $id) | .html_url')
          RUN_EVENT=$(echo "$RUNS" | jq -r --argjson id "$RUN_ID" \
            '.[] | select(.id == $id) | .event')

          # The jobs list of that run is the authority on what actually ran.
          # Bounded: one page of 100 jobs.
          if ! JOBS=$(gh api \
            "/repos/${REPO}/actions/runs/${RUN_ID}/jobs?per_page=100" \
            --jq '.jobs'); then
            echo "::error::CI jobs API error for run ${RUN_ID}"
            exit 1
          fi

          BAD=$(echo "$JOBS" | jq -r '[.[]
            | select(.status != "completed" or .conclusion != "success")]
            | .[] | "  \(.name): \(.status)/\(.conclusion // "null")"')
          if [ -n "$BAD" ]; then
            echo "$BAD"
            echo "::error::CI run ${RUN_ID} has job(s) that are not completed+success (PF-017)"
            exit 1
          fi

          N=$(echo "$JOBS" | jq 'length')
          if [ "$N" -lt "$MIN_CI_JOBS" ]; then
            echo "::error::CI run ${RUN_ID} has only ${N} jobs; expected >= ${MIN_CI_JOBS} (ADR-013 required-context count) - a gutted workflow is not a pass"
            exit 1
          fi

          echo "CI run ${RUN_ID} (event=${RUN_EVENT}): ${RUN_URL}"
          echo "  ${N} job(s), all completed+success (floor: ${MIN_CI_JOBS})"
          echo "CI history OK for ${SHA}"

  # ---------------------------------------------------------------------------
  # A6 — cross-compile the native addon for all 7 targets.
  # Linux legs: x86_64-gnu uses napi's --use-napi-cross (gnu sysroot);
  # aarch64-gnu links with the apt cross gcc: --use-napi-cross regressed on
  # aarch64 in 4e88ebd (the then macOS-generated lockfile did not resolve
  # @napi-rs/tar-linux-x64-gnu). Not re-tested since; the apt gcc works.
  # BOTH musl legs link with a zig cc wrapper because --use-napi-cross has
  # no musl toolchain and napi forces -C target-feature=-crt-static on musl,
  # so the host gcc would link glibc (see x86_64-unknown-linux-musl).
  # macOS x86_64 cross-links from the arm64 host via the installed target.
  # `--no-js` preserves the hand-written index.js loader (index.d.ts still
  # regenerates).
  # ---------------------------------------------------------------------------
  build-napi:
    name: Build napi (${{ matrix.settings.target }})
    needs: [version-gate]
    if: ${{ !cancelled() && needs.version-gate.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-latest
            target: aarch64-apple-darwin
            build: napi build --platform --release --target aarch64-apple-darwin --no-js
          - host: macos-latest
            target: x86_64-apple-darwin
            build: napi build --platform --release --target x86_64-apple-darwin --no-js
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            build: napi build --platform --release --target x86_64-unknown-linux-gnu --use-napi-cross --no-js
          - host: ubuntu-latest
            target: x86_64-unknown-linux-musl
            build: napi build --platform --release --target x86_64-unknown-linux-musl --no-js
            use-zig: true
            setup: |
              # --use-napi-cross supports gnu triples only: @napi-rs/cross-toolchain
              # has no musl entry, so napi warned "Unsupported arch: x64 triple:
              # x86_64-unknown-linux-musl", swallowed it, and built the musl target
              # with the host gcc. Because napi forces -C target-feature=-crt-static
              # on every musl ABI (a cdylib cannot use crt-static), rustc's
              # self-contained musl libc is off too, so that link resolved -lc
              # against the runner's glibc: v0.1.0-v0.3.0 shipped a linux-x64-musl
              # addon needing libc.so.6 / GLIBC_2.34 (rust-lang/rust#135244).
              # zig cc supplies musl, exactly as on aarch64-musl. No arg
              # filter here: of the flags zig cc's allowlist rejects,
              # --fix-cortex-a53-843419 is aarch64-only, and
              # -Wl,-znostart-stop-gc (also rejected by zig 0.16.0;
              # cargo-zigbuild filters both in src/zig/linker_args.rs)
              # is gated by rustc to llvm_target x86_64-unknown-linux-gnu
              # (rust-lang/rust#137685). If a future rustc widens that
              # gate this leg fails with "unsupported linker extension
              # flag: -z nostart-stop-gc".
              cat > /tmp/zig-cc-x86_64-musl <<'ZIGCC'
              #!/bin/sh
              exec zig cc -target x86_64-linux-musl "$@"
              ZIGCC
              chmod +x /tmp/zig-cc-x86_64-musl
              echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=/tmp/zig-cc-x86_64-musl" >> "$GITHUB_ENV"
          - host: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            build: napi build --platform --release --target aarch64-unknown-linux-gnu --no-js
            setup: |
              sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
              echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          - host: ubuntu-latest
            target: aarch64-unknown-linux-musl
            build: napi build --platform --release --target aarch64-unknown-linux-musl --no-js
            use-zig: true
            setup: |
              # rustc 1.98.0 (rust-lang/rust#155453) passes -Wl,--fix-cortex-a53-843419 for
              # both aarch64 linux targets. GNU ld accepts it (the -gnu leg builds); zig cc
              # rejects any -Wl, arg missing from its own allowlist before lld sees it, and no
              # released zig accepts this one (ziglang/zig#36624 on Codeberg, open). lld never
              # applies the erratum fix by default, so no zig-linked artifact we have shipped
              # ever carried it; stripping restores v0.3.0 behaviour. Same remedy as
              # cargo-zigbuild#452. The loop is bounded: exactly $# iterations, order kept.
              cat > /tmp/zig-cc-aarch64-musl <<'ZIGCC'
              #!/bin/sh
              n=$#
              i=0
              while [ "$i" -lt "$n" ]; do
                arg=$1
                shift
                i=$((i + 1))
                case "$arg" in
                  -Wl,--fix-cortex-a53-843419|--fix-cortex-a53-843419) ;;
                  *) set -- "$@" "$arg" ;;
                esac
              done
              exec zig cc -target aarch64-linux-musl "$@"
              ZIGCC
              chmod +x /tmp/zig-cc-aarch64-musl
              # Self-check with a fake zig: a silently broken filter must fail here, not at
              # link time (positive control: the flag is present on input and must be gone).
              mkdir -p /tmp/fakezig
              printf '#!/bin/sh\nprintf "%%s\\n" "$@"\n' > /tmp/fakezig/zig
              chmod +x /tmp/fakezig/zig
              OUT=$(PATH=/tmp/fakezig:$PATH /tmp/zig-cc-aarch64-musl -Wl,--fix-cortex-a53-843419 -o out.so obj.o)
              echo "$OUT" | grep -q 843419 && { echo "::error::zig wrapper failed to strip --fix-cortex-a53-843419"; exit 1; }
              echo "$OUT" | grep -qx -- '-o' || { echo "::error::zig wrapper dropped unrelated args"; exit 1; }
              rm -rf /tmp/fakezig
              echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=/tmp/zig-cc-aarch64-musl" >> "$GITHUB_ENV"
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            build: napi build --platform --release --target x86_64-pc-windows-msvc --no-js
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install zig
        if: matrix.settings.use-zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Setup cross-compilation tools
        if: matrix.settings.setup
        run: ${{ matrix.settings.setup }}
      - run: npm ci
      - name: Build addon
        working-directory: crates/mds-napi
        run: npx ${{ matrix.settings.build }}
      - name: Assert musl artifact links musl, not glibc
        if: ${{ endsWith(matrix.settings.target, '-linux-musl') }}
        working-directory: crates/mds-napi
        run: |
          # Detector self-test: the glibc pattern must fire on a planted glibc
          # NEEDED line, so a silently broken pattern cannot read as "clean".
          GLIBC_RE='libc\.so\.6|ld-linux'
          printf ' 0x0000000000000001 (NEEDED) Shared library: [libc.so.6]\n' \
            | grep -Eq "$GLIBC_RE" \
            || { echo "::error::glibc detector self-test failed to fire"; exit 1; }
          shopt -s nullglob
          set -- *.node
          [ "$#" -eq 1 ] || { echo "::error::expected exactly one .node artifact, found $#${1:+: $*}"; exit 1; }
          node_file=$1
          readelf -d "$node_file" > /tmp/dyn.txt
          # Non-vacuity guard: readelf must have produced NEEDED entries at all.
          grep -q 'NEEDED' /tmp/dyn.txt || { echo "::error::no NEEDED entries parsed from $node_file"; exit 1; }
          if grep -Eq "$GLIBC_RE" /tmp/dyn.txt; then
            echo "::error::$node_file is glibc-linked; expected musl (libc.so)"
            cat /tmp/dyn.txt
            exit 1
          fi
          # Positive assertion: a musl cdylib links musl's libc by its
          # soname libc.so.
          grep -q 'Shared library: \[libc\.so\]' /tmp/dyn.txt || {
            echo "::error::$node_file does not link musl libc.so"
            cat /tmp/dyn.txt
            exit 1
          }
          cat /tmp/dyn.txt
      - uses: actions/upload-artifact@v7
        with:
          name: bindings-${{ matrix.settings.target }}
          path: crates/mds-napi/*.node
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # A3/A7/D2 — stage the per-platform npm packages from the built .node files,
  # then run the CRITICAL name<->loader gate. Runs on BOTH tag push and the
  # workflow_dispatch dry run; it never publishes. The publish job consumes the
  # exact staged tree this job uploads.
  # ---------------------------------------------------------------------------
  stage-and-verify-napi:
    name: Stage + verify platform packages
    needs: [build-napi]
    if: ${{ !cancelled() && needs.build-napi.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Download all .node artifacts
        uses: actions/download-artifact@v8
        with:
          path: crates/mds-napi/artifacts
          pattern: bindings-*
          merge-multiple: true
      - name: Stage per-platform packages
        working-directory: crates/mds-napi
        run: |
          npx napi create-npm-dirs
          npx napi artifacts --output-dir .
      - name: Copy LICENSE into each platform package
        run: for d in crates/mds-napi/npm/*/; do cp LICENSE "$d"; done
      - name: A3 — name <-> loader verification gate
        run: node scripts/verify-napi-names.mjs
      - name: Upload staged napi tree
        uses: actions/upload-artifact@v7
        with:
          name: napi-staged
          path: |
            crates/mds-napi/npm/**
            crates/mds-napi/*.node

  # ---------------------------------------------------------------------------
  # Python wheels + sdist — cp311-abi3, 7 platforms + sdist.
  # THIS JOB IS NOT REF-GUARDED: it runs on both workflow_dispatch (dry run)
  # and tag push. Only the upload to PyPI (publish-python) is tag-guarded.
  # (PF-039: every step behind a ref guard is code the dry run cannot execute;
  # the build + verification gate must run in dispatch mode to be tested.)
  #
  # The wheel verification gate (readelf on Linux legs) guards against silent
  # glibc contamination of musl targets — a toolchain fallback that produces an
  # artifact with the right NAME and the wrong libc (PF-038). It mirrors the
  # build-napi musl readelf gate: positive control + non-vacuity guard.
  #
  # build-python is in publish-crates's needs: so a Python build failure aborts
  # the release before ANY registry write (crates.io is irreversible — PF-023).
  # ---------------------------------------------------------------------------
  build-python:
    name: Build Python (${{ matrix.target || 'sdist' }})
    needs: [version-gate]
    if: ${{ !cancelled() && needs.version-gate.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- manylinux (glibc) ---
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: "2_17"
            plat-tag: manylinux_2_17_x86_64
            libc: glibc
          - host: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            manylinux: "2_17"
            plat-tag: manylinux_2_17_aarch64
            libc: glibc
          # --- musllinux ---
          - host: ubuntu-latest
            target: x86_64-unknown-linux-musl
            manylinux: musllinux_1_2
            plat-tag: musllinux_1_2_x86_64
            libc: musl
          - host: ubuntu-latest
            target: aarch64-unknown-linux-musl
            manylinux: musllinux_1_2
            plat-tag: musllinux_1_2_aarch64
            libc: musl
          # --- macOS ---
          - host: macos-latest
            target: aarch64-apple-darwin
            plat-tag: macosx_.*_arm64
            expect-arch: arm64
          - host: macos-latest
            target: x86_64-apple-darwin
            plat-tag: macosx_.*_x86_64
            expect-arch: x86_64
          # --- Windows ---
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            plat-tag: win_amd64
          # --- sdist (source distribution, once) ---
          - host: ubuntu-latest
            sdist: true
    runs-on: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
      # Rust toolchain needed for macOS/Windows wheel builds. Linux legs run
      # inside maturin-action containers that provide their own Rust toolchain,
      # so we skip the host install there — it is unreachable by the container
      # build and its artifacts would poison the shared Swatinem/rust-cache key
      # (host target/release/build/ artifacts built on Ubuntu 22.04 have a
      # higher glibc requirement than the manylinux 2.17 container runtime).
      - uses: dtolnay/rust-toolchain@stable
        if: ${{ !matrix.sdist && runner.os != 'Linux' }}
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        if: ${{ !matrix.sdist }}
        with:
          key: ${{ matrix.target }}-${{ matrix.manylinux }}
      # --- build wheel ---
      - name: Build wheel
        if: ${{ !matrix.sdist }}
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1.51.0
        with:
          command: build
          args: --release --locked --compatibility pypi -m crates/mds-python/Cargo.toml --out dist
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          maturin-version: "v1.13.3"
      # --- build sdist ---
      - name: Build sdist
        if: ${{ matrix.sdist }}
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1.51.0
        with:
          command: sdist
          args: -m crates/mds-python/Cargo.toml --out dist
          maturin-version: "v1.13.3"
      # --- wheel filename gate (all wheel legs) ---
      # Asserts cp311-abi3 tag and the expected platform string are both present.
      # A wrong Python tag or missing platform tag is a packaging defect that
      # would be accepted by pip but install under the wrong interpreter.
      - name: Assert wheel filename (cp311-abi3 + platform tag)
        if: ${{ !matrix.sdist }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          set -- dist/*.whl
          [ "$#" -eq 1 ] \
            || { echo "::error::expected exactly 1 .whl in dist/, found $#${1:+: $*}"; exit 1; }
          WHEEL="$1"
          FNAME=$(basename "$WHEEL")
          echo "Wheel: $FNAME"
          echo "$FNAME" | grep -q 'cp311-abi3' \
            || { echo "::error::wheel is not cp311-abi3: $FNAME"; exit 1; }
          PLAT_TAG="${{ matrix.plat-tag }}"
          echo "$FNAME" | grep -Eq "$PLAT_TAG" \
            || { echo "::error::wheel platform tag missing '$PLAT_TAG': $FNAME"; exit 1; }
          echo "Wheel filename OK"
      # --- wheel version gate (all wheel legs) ---
      # Asserts the wheel version matches the workspace Cargo version. Maturin
      # reads the version dynamically from Cargo.toml, so this mainly guards
      # against a misconfigured pyproject.toml overriding dynamic versioning.
      - name: Assert wheel version matches workspace version
        if: ${{ !matrix.sdist }}
        shell: bash
        run: |
          set -euo pipefail
          # Read workspace version directly from root Cargo.toml (no cargo
          # invocation needed; the version is a plain string in the file).
          # awk 'NR==1{print;exit}' avoids SIGPIPE from head -1 under pipefail (F11).
          WS_VER=$(grep -A20 '^\[workspace\.package\]' Cargo.toml \
            | grep '^version' | awk 'NR==1{print;exit}' | sed 's/.*"\([^"]*\)".*/\1/')
          # F12: Cargo pre-release versions (e.g. 0.5.0-rc.1) normalize differently
          # under PEP 440 (0.5.0rc1 in the wheel name). Fail loudly rather than
          # silently comparing mismatched formats.
          if echo "$WS_VER" | grep -q '-'; then
            echo "::error::pre-release workspace version '$WS_VER' is not supported by this gate — PEP 440 normalization differs from Cargo syntax (e.g. 0.5.0-rc.1 becomes 0.5.0rc1 in wheel names). Verify the wheel filename field manually."
            exit 1
          fi
          shopt -s nullglob
          set -- dist/*.whl
          WHEEL="$1"
          # Wheel filename: {name}-{version}-{python}-{abi}-{platform}.whl
          WHEEL_VER=$(basename "$WHEEL" | cut -d'-' -f2)
          echo "Workspace version: $WS_VER  Wheel version: $WHEEL_VER"
          [ "$WS_VER" = "$WHEEL_VER" ] \
            || { echo "::error::wheel version $WHEEL_VER != workspace version $WS_VER"; exit 1; }
          echo "Wheel version OK"
      # --- libc linkage gate (Linux wheel legs only — readelf available) ---
      # Asserts the .so inside the wheel links the correct libc. A cross-compile
      # toolchain with no musl entry silently falls back to the host glibc
      # compiler, producing an artifact with the right NAME and the wrong libc
      # (PF-038; mirrors the build-napi musl readelf gate exactly).
      - name: Assert wheel links correct libc (PF-038)
        if: ${{ runner.os == 'Linux' && !matrix.sdist }}
        shell: bash
        run: |
          set -euo pipefail
          LIBC="${{ matrix.libc }}"
          GLIBC_RE='libc\.so\.6|ld-linux'
          # Positive control: the glibc detector MUST fire on a planted NEEDED
          # line. A silently broken detector cannot pass as "clean" (PF-038).
          printf ' 0x0000000000000001 (NEEDED) Shared library: [libc.so.6]\n' \
            | grep -Eq "$GLIBC_RE" \
            || { echo "::error::glibc detector self-test failed to fire"; exit 1; }
          shopt -s nullglob
          set -- dist/*.whl
          [ "$#" -eq 1 ] \
            || { echo "::error::expected exactly 1 .whl in dist/, found $#"; exit 1; }
          TMP=$(mktemp -d)
          unzip -q "$1" -d "$TMP"
          # -print -quit: stop after the first match; avoids SIGPIPE from | head -1
          # under set -euo pipefail (F11).
          SO=$(find "$TMP" -name "*.so" -print -quit)
          [ -n "$SO" ] \
            || { echo "::error::no .so found in wheel $1"; exit 1; }
          echo "Checking: $SO"
          readelf -d "$SO" > "$TMP/dyn.txt"
          # Non-vacuity guard: NEEDED entries must exist. An empty parse reads
          # as "clean" but proves nothing (PF-038).
          grep -q 'NEEDED' "$TMP/dyn.txt" \
            || { echo "::error::no NEEDED entries in $SO — parse failed or artifact is static"; exit 1; }
          if [ "$LIBC" = "musl" ]; then
            # musllinux: must NOT link glibc
            if grep -Eq "$GLIBC_RE" "$TMP/dyn.txt"; then
              echo "::error::$SO is glibc-linked; expected musl (libc.so)"
              cat "$TMP/dyn.txt"
              exit 1
            fi
            # Positive assertion: musl cdylib links musl's libc by its soname libc.so
            grep -q 'Shared library: \[libc\.so\]' "$TMP/dyn.txt" \
              || { echo "::error::$SO does not link musl libc.so"; cat "$TMP/dyn.txt"; exit 1; }
          else
            # manylinux (glibc): must link glibc
            if ! grep -Eq "$GLIBC_RE" "$TMP/dyn.txt"; then
              echo "::error::$SO is not glibc-linked; expected glibc for manylinux target"
              cat "$TMP/dyn.txt"
              exit 1
            fi
          fi
          cat "$TMP/dyn.txt"
          rm -rf "$TMP"
      # --- sdist version gate (sdist leg only) ---
      # Asserts the sdist version matches the workspace Cargo version. Maturin
      # reads the version dynamically, but this guards against a misconfigured
      # pyproject.toml override. The sdist is published to PyPI and is the
      # fallback for every platform without a wheel (F9).
      - name: Assert sdist version matches workspace version
        if: ${{ matrix.sdist }}
        shell: bash
        run: |
          set -euo pipefail
          WS_VER=$(grep -A20 '^\[workspace\.package\]' Cargo.toml \
            | grep '^version' | awk 'NR==1{print;exit}' | sed 's/.*"\([^"]*\)".*/\1/')
          shopt -s nullglob
          set -- dist/*.tar.gz
          [ "$#" -eq 1 ] || { echo "::error::expected exactly 1 .tar.gz in dist/, found $#"; exit 1; }
          # PEP 625: sdist filename is {name}-{version}.tar.gz (name normalized with underscores).
          # rev | cut -d- -f1 | rev extracts the last hyphen-delimited field (the version),
          # which works for names with or without hyphens.
          SDIST_VER=$(basename "$1" .tar.gz | rev | cut -d- -f1 | rev)
          echo "Workspace version: $WS_VER  Sdist version: $SDIST_VER"
          [ "$WS_VER" = "$SDIST_VER" ] \
            || { echo "::error::sdist version $SDIST_VER != workspace version $WS_VER"; exit 1; }
          echo "Sdist version OK"
      # --- macOS arch gate (macOS wheel legs only — lipo available) ---
      # Darwin analogue of the Linux readelf gate (PF-038): asserts the .so inside
      # the wheel carries the expected architecture slice.
      - name: Assert macOS wheel arch (PF-038, Darwin analogue)
        if: ${{ runner.os == 'macOS' && !matrix.sdist }}
        shell: bash
        run: |
          set -euo pipefail
          TMP=$(mktemp -d)
          unzip -q dist/*.whl -d "$TMP"
          SO=$(find "$TMP" -name '*.so' -print -quit)
          ARCHS=$(lipo -archs "$SO")
          echo "$ARCHS" | grep -qw "${{ matrix.expect-arch }}" \
            || { echo "::error::$SO is [$ARCHS], expected ${{ matrix.expect-arch }}"; exit 1; }
          echo "macOS arch OK: $SO is [$ARCHS]"
          rm -rf "$TMP"
      - uses: actions/upload-artifact@v7
        with:
          name: python-${{ matrix.target || 'sdist' }}
          path: dist/
          if-no-files-found: error

  # ===========================================================================
  # Everything below publishes — gated to tag pushes only.
  # workflow_dispatch (no inputs) stops above; publish jobs see a non-tag ref
  # and their startsWith(github.ref, 'refs/tags/v') condition evaluates false.
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # crates.io — library then CLI (CLI depends on the library; order + index
  # propagation matter). Requires repo secret CARGO_REGISTRY_TOKEN.
  # ---------------------------------------------------------------------------
  publish-crates:
    name: Publish to crates.io
    # stage-and-verify-napi is listed here so the critical A3 name<->loader gate
    # (RELEASING.md "hard checkpoint") must pass before crates.io (irreversible)
    # publishes. Without this, the 7-target napi matrix can still be running while
    # crates.io is already live at the new version.
    # build-python is listed here so a Python wheel build failure aborts the
    # release before ANY registry write. crates.io is irreversible; blocking
    # on Python here avoids a partial state where crates.io is live but PyPI
    # fails (PF-023; PF-039: build-python runs unguarded so this blocking is
    # exercised by the dispatch dry run).
    needs: [version-gate, stage-and-verify-napi, build-python]
    if: ${{ !cancelled() && needs.version-gate.result == 'success' && needs.stage-and-verify-napi.result == 'success' && needs.build-python.result == 'success' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify tag matches workspace version
        run: |
          TAG="${{ github.ref_name }}"
          TAG="${TAG#v}"
          CRATE_VER="$(cargo metadata --no-deps --format-version 1 \
            | grep -o '"name":"mds-core","version":"[^"]*"' \
            | grep -o '[0-9][^"]*' | head -1)"
          echo "tag=$TAG crate=$CRATE_VER"
          test "$TAG" = "$CRATE_VER" || { echo "::error::tag v$TAG != crate version $CRATE_VER"; exit 1; }
      - name: Publish mds-core
        run: |
          # Idempotency: a re-run where the version is already published should pass.
          # Any other failure (bad token, outage, genuine version conflict) must fail loudly.
          if OUTPUT=$(cargo publish -p mds-core --token "${{ secrets.CARGO_REGISTRY_TOKEN }}" 2>&1); then
            echo "$OUTPUT"
          elif echo "$OUTPUT" | grep -qE "already (uploaded|exists|published)"; then
            echo "::notice::mds-core already published — idempotent re-run, skipping"
            echo "$OUTPUT"
          else
            echo "::error::mds-core publish failed"
            echo "$OUTPUT"
            exit 1
          fi
      - name: Wait for crates.io index to update
        run: |
          # Bounded poll — max 20 attempts × 15 s = 300 s (5 min), then fail with
          # a clear message. Avoids the former unbounded sleep 30 that silently
          # masked races on slow registry propagation.
          VERSION=$(cargo metadata --no-deps --format-version 1 \
            | grep -o '"name":"mds-core","version":"[^"]*"' \
            | grep -o '[0-9][^"]*' | head -1)
          echo "Polling crates.io for mds-core@${VERSION} (max 20 × 15 s)"
          MAX=20
          for i in $(seq 1 "$MAX"); do
            if curl -sf --max-time 20 --connect-timeout 10 \
                 "https://crates.io/api/v1/crates/mds-core/${VERSION}" \
                 -H "User-Agent: mds-release-ci/1.0" \
                 | grep -qF "\"num\":\"${VERSION}\""; then
              echo "mds-core@${VERSION} is visible in crates.io (attempt $i/$MAX)"
              exit 0
            fi
            echo "  Attempt $i/$MAX: not yet visible — sleeping 15 s..."
            sleep 15
          done
          echo "::error::mds-core@${VERSION} not visible in crates.io after $((MAX * 15)) s"
          exit 1
      - name: Publish mds-cli
        run: |
          # Same idempotency guard as mds-core above.
          if OUTPUT=$(cargo publish -p mds-cli --token "${{ secrets.CARGO_REGISTRY_TOKEN }}" 2>&1); then
            echo "$OUTPUT"
          elif echo "$OUTPUT" | grep -qE "already (uploaded|exists|published)"; then
            echo "::notice::mds-cli already published — idempotent re-run, skipping"
            echo "$OUTPUT"
          else
            echo "::error::mds-cli publish failed"
            echo "$OUTPUT"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # A7/B4/D3 — publish all npm packages with provenance (OIDC).
  # NPM_CONFIG_PROVENANCE=true makes every `npm publish` (including the ones napi
  # prepublish runs for the platform packages) emit a provenance attestation.
  # ---------------------------------------------------------------------------
  publish-npm:
    name: Publish to npm
    needs: [stage-and-verify-napi, publish-crates]
    if: ${{ !cancelled() && needs.stage-and-verify-napi.result == 'success' && needs.publish-crates.result == 'success' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC for npm provenance
      contents: read
    env:
      NPM_CONFIG_PROVENANCE: "true"
      NPM_CONFIG_ACCESS: "public"
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          registry-url: "https://registry.npmjs.org"
      # performance-01 / PF-021: pin to the same 1.96.0 SHA that ci.yml's wasm
      # job uses so the compiler that MEASURES size and the compiler that BUILDS
      # the published artifact are identical. Unpinned @stable lets toolchain
      # drift silently push the binary past the 850 KB guard between releases.
      # WHEN BUMPING: update ci.yml's wasm job pin first, re-measure, then
      # update here to keep both in sync.
      - uses: dtolnay/rust-toolchain@01ba1edad32c6f80dbcce879d3e0fa5a00b2a84e  # 1.96.0
        with: { targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/setup-wasm
      - run: npm ci
      - name: Restore staged napi tree (.node + npm/ platform dirs)
        uses: actions/download-artifact@v8
        with:
          name: napi-staged
          path: crates/mds-napi
      # A4 — regenerate index.d.ts on the publish host (hand-written index.js is
      # preserved by --no-js); the stray host .node is not in the package `files`.
      - name: Generate napi types
        working-directory: crates/mds-napi
        run: npx napi build --platform --release --no-js
      - name: Re-run A3 gate against the restored tree
        run: node scripts/verify-napi-names.mjs
      # Build all artifacts BEFORE the first irreversible publish. A tsc/wasm-opt
      # failure after any npm publish leaves partial state that cannot be healed
      # without a manual laptop publish (which loses OIDC provenance).
      - name: Build WASM + TS packages
        run: |
          npm run build -w @mdscript/mds-wasm
          npm run build --workspaces --if-present
      # performance-01 / PF-021: defence-in-depth size guard on the ACTUAL
      # published artifact (built above by the pinned 1.96.0 toolchain). Mirrors
      # ci.yml's 850,000-byte threshold byte-for-byte. Runs BEFORE any irreversible
      # npm publish so a bloated binary aborts before anything reaches the registry.
      - name: "Assert WASM binary size < 850,000 bytes (PF-021)"
        run: |
          for f in packages/mds-wasm/dist/node/mds_wasm_bg.wasm \
                   packages/mds-wasm/dist/web/mds_wasm_bg.wasm; do
            if [ ! -f "$f" ]; then
              echo "::error::WASM file missing: $f"
              exit 1
            fi
            raw=$(wc -c < "$f" | tr -d ' ')
            echo "::notice::WASM ${f}: ${raw} bytes"
            if [ "$raw" -gt 850000 ]; then
              echo "::error::WASM binary exceeds 850,000 byte threshold: ${f} is ${raw} bytes"
              exit 1
            fi
          done
      - name: Publish platform packages (napi prepublish)
        working-directory: crates/mds-napi
        run: |
          # Idempotency: a re-run finds already-published platform packages and
          # returns E403. Tolerate E403-only failures; any other error fails loudly.
          # Do NOT use continue-on-error: it converts a hard failure into a silent
          # partial release unrecoverable without a manual laptop publish (which
          # loses OIDC provenance). PF-023.
          if OUTPUT=$(npx napi prepublish -t npm 2>&1); then
            echo "$OUTPUT"
          else
            NON_E403=$(echo "$OUTPUT" | grep -i "npm error" | grep -vi "E403" || true)
            if [ -n "$NON_E403" ]; then
              echo "::error::napi prepublish failed with non-E403 errors"
              echo "$OUTPUT"
              exit 1
            fi
            echo "::notice::All platform packages already published (E403) — idempotent re-run, skipping"
            echo "$OUTPUT"
          fi
      - name: Publish npm packages
        run: |
          # Idempotency: publish_if_absent checks npm view before publishing so
          # a re-run skips already-published versions without swallowing genuine
          # failures. Never use continue-on-error — it masks partial state. PF-023.
          VER="${{ github.ref_name }}"
          VER="${VER#v}"
          publish_if_absent() {
            local pkg="$1"
            if npm view "${pkg}@${VER}" version >/dev/null 2>&1; then
              echo "::notice::${pkg}@${VER} already published — idempotent re-run, skipping"
              return 0
            fi
            if OUTPUT=$(npm publish -w "${pkg}" --access public 2>&1); then
              echo "$OUTPUT"
            else
              echo "::error::${pkg}@${VER} publish failed"
              echo "$OUTPUT"
              exit 1
            fi
          }
          publish_if_absent "@mdscript/mds-napi"
          publish_if_absent "@mdscript/mds-wasm"
          publish_if_absent "@mdscript/mds"
          publish_if_absent "@mdscript/bundler-utils"
          publish_if_absent "@mdscript/vite-plugin"
          publish_if_absent "@mdscript/rollup-plugin"
          publish_if_absent "@mdscript/webpack-loader"
          publish_if_absent "@mdscript/rspack-loader"

  # ---------------------------------------------------------------------------
  # PyPI — Python wheels + sdist (OIDC trusted publishing, PEP 740 attestations).
  # skip-existing: true — a re-run after partial failure must not abort on
  # already-uploaded files (PF-023).
  # IMPORTANT: NO environment: field. The PyPI trusted publisher for this project
  # was filed with the environment field BLANK. A named environment causes PyPI
  # to reject the OIDC token because the claim does not match the filed record.
  # Likewise this job must stay in release.yml specifically; moving it to another
  # workflow file breaks the filed record (workflow filename is part of the claim).
  # ---------------------------------------------------------------------------
  publish-python:
    name: Publish to PyPI
    needs: [build-python, publish-crates, publish-npm]
    if: ${{ !cancelled() && needs.build-python.result == 'success' && needs.publish-crates.result == 'success' && needs.publish-npm.result == 'success' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # OIDC for PyPI trusted publishing + PEP 740 attestations
      contents: read
    steps:
      - name: Download Python artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: python-*
          path: python-dist/
          merge-multiple: true
      # F4: assert completeness before upload. actions/download-artifact exits 0
      # on zero matches; pypa/gh-action-pypi-publish emits only a warning on an
      # empty packages-dir. Both pass silently on a partial upload. This gate
      # catches the dangerous case: 5 of 8 distributions upload, twine succeeds,
      # and the release is declared done with three platforms missing.
      - name: Assert all 8 Python distributions are present
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          ls -la python-dist/
          whl=(python-dist/*.whl); sd=(python-dist/*.tar.gz)
          [ "${#whl[@]}" -eq 7 ] || { echo "::error::expected 7 wheels, found ${#whl[@]}"; exit 1; }
          [ "${#sd[@]}"  -eq 1 ] || { echo "::error::expected 1 sdist, found ${#sd[@]}"; exit 1; }
          echo "Python distributions complete: ${#whl[@]} wheels + ${#sd[@]} sdist"
      - name: Publish to PyPI
        # IMPORTANT: Do NOT change this pin back to a commit SHA.
        # pypa/gh-action-pypi-publish is a Docker-based composite action that
        # derives its GHCR image tag from `github.action_ref`. When you pin via
        # `@<sha>`, GitHub Actions sets action_ref to that SHA, and the action
        # pulls ghcr.io/pypa/gh-action-pypi-publish:<sha>. GHCR only publishes
        # images for tagged releases — not for every commit SHA.
        # The v0.4.1 release used `@a892a5a...`, which is the annotated *tag
        # object* SHA for v1.14.2 (not the commit SHA). No GHCR image exists for
        # it, so the publish-python job failed with "manifest unknown". The
        # underlying commit SHA (dc37677b...) does have a GHCR image and could
        # be used as a SHA pin, but the risk of the same annotated-vs-commit
        # confusion recurring outweighs the marginal supply-chain benefit here.
        # Using the version tag is unambiguous: v1.14.2 maps directly to a
        # published GHCR image (verified via GitHub Packages API, 2026-09-03).
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          packages-dir: python-dist/
          skip-existing: true
          attestations: true

  # ---------------------------------------------------------------------------
  # GitHub Release — cut last, after crates + npm + PyPI succeed.
  # ---------------------------------------------------------------------------
  github-release:
    name: GitHub Release
    needs: [publish-crates, publish-npm, publish-python]
    if: ${{ !cancelled() && needs.publish-crates.result == 'success' && needs.publish-npm.result == 'success' && needs.publish-python.result == 'success' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
      - name: Create release
        run: |
          TAG="${{ github.ref_name }}"
          gh release create "$TAG" --title "$TAG" --generate-notes 2>&1 \
            || gh release edit "$TAG" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
