[package]
name = "mds-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "MDS (Markdown Script) compiler — composable LLM prompt templates (library)"
license.workspace = true
readme.workspace = true
repository.workspace = true
keywords.workspace = true
categories = ["template-engine", "text-processing"]

[lib]
name = "mds"

[dependencies]
indexmap = { workspace = true }
serde = { workspace = true }
serde_yaml_ng = { workspace = true }
serde_json = { workspace = true }
miette = { workspace = true }
thiserror = { workspace = true }

# Reuse the workspace's portable O_NONBLOCK constant for regular vars opens.
[target.'cfg(unix)'.dependencies]
rustix = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = { workspace = true }
